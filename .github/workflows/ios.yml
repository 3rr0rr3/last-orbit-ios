name: Test and build iPhone game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    name: Gameplay and mobile browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate and test survival simulation
        run: |
          node --check web/game.js
          node --check web/engine.js
          node --check web/content.js
          node --check web/art.js
          node tests/game.test.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test on mobile Chromium and WebKit
        run: node tests/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-screenshots
          path: test-results/
          if-no-files-found: ignore

  ios:
    name: iPhone simulator test and IPA build
    needs: gameplay
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in items if "iPhone" in d["name"]))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Launch game and test native WebView
        run: |
          xcodebuild test -project LastOrbit.xcodeproj -scheme LastOrbit -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/simulator -resultBundlePath build/iPhoneTests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Compile iPhone device app
        run: |
          xcodebuild build -project LastOrbit.xcodeproj -scheme LastOrbit -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/device/Build/Products/Release-iphoneos/LastOrbit.app dist/Payload/
          test -f dist/Payload/LastOrbit.app/web/index.html
          test -f dist/Payload/LastOrbit.app/web/game.js
          test -f dist/Payload/LastOrbit.app/web/style.css
          test -f dist/Payload/LastOrbit.app/web/engine.js
          test -f dist/Payload/LastOrbit.app/web/content.js
          test -f dist/Payload/LastOrbit.app/web/art.js
          test -f dist/Payload/LastOrbit.app/web/expansion.css
          cd dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload LastOrbit-unsigned.ipa
          shasum -a 256 LastOrbit-unsigned.ipa > LastOrbit-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LastOrbit-unsigned-IPA
          path: |
            dist/LastOrbit-unsigned.ipa
            dist/LastOrbit-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-test-results
          path: build/iPhoneTests.xcresult
          if-no-files-found: ignore

  release:
    name: Publish IPA download
    if: github.event_name != 'pull_request'
    needs: [gameplay, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LastOrbit-unsigned-IPA
          path: dist
      - name: Publish tested build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "build-$BUILD_NUMBER" dist/LastOrbit-unsigned.ipa dist/LastOrbit-unsigned.ipa.sha256 --target "$COMMIT_SHA" --title "Last Orbit — build $BUILD_NUMBER" --prerelease --notes "Gameplay simulation, mobile Chromium and WebKit tests, and iPhone simulator UI test passed. This IPA is unsigned and requires signing with your own Apple credentials using a sideloading tool before installation. It cannot be installed by tapping the link in Safari."
